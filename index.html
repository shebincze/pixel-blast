<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12121c">
<title>Pixel Blast</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>
  </div>

  <div id="name-overlay" class="hidden">
    <form id="name-form">
      <label for="name-input">Jméno postavy</label>
      <input id="name-input" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="HONZIK">
      <button type="submit">Hrát</button>
    </form>
  </div>

  <div id="touch" class="hidden">
    <div class="pad-left">
      <button class="btn" data-key="left" aria-label="Doleva">◀</button>
      <button class="btn" data-key="right" aria-label="Doprava">▶</button>
    </div>
    <div class="pad-right">
      <button class="btn btn-shoot" data-key="shoot" aria-label="Laser">✷</button>
      <button class="btn btn-jump" data-key="jump" aria-label="Skok">▲</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
